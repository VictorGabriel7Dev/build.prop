name: Build Pixel Prop (manual)

on:
  # Manual, on-demand tool only. The published corpus (full partitions + vbmeta.digest, all
  # channels) is produced and committed out-of-band by the authoritative pipeline, which is the
  # single writer of this repository. This workflow NEVER commits or creates releases: it extracts
  # a device's latest .prop and offers it as a downloadable artifact, so anyone can build one on
  # GitHub's own infrastructure without the full pipeline.
  workflow_dispatch:
    inputs:
      devices:
        description: 'Device codenames (space-separated, or "all")'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # PREPARE: Determine which devices to build based on input or default list
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set_devices.outputs.devices }}
    steps:
      - name: Determine device list
        id: set_devices
        run: |
          # Pixel 6 and newer (Tensor-era devices with modern partition layout)
          if [ "${{ github.event.inputs.devices }}" = "all" ] || [ -z "${{ github.event.inputs.devices }}" ]; then
            JSON='[
              "oriole", "raven", "bluejay",
              "panther", "cheetah", "lynx",
              "felix", "tangorpro",
              "shiba", "husky", "akita",
              "tokay", "caiman", "komodo", "comet", "tegu",
              "frankel", "blazer", "mustang", "stallion", "rango",
              "cubs", "grizzly", "kodiak", "yogi"
            ]'
          else
            # Convert space-separated input into a JSON array
            JSON=$(echo '${{ github.event.inputs.devices }}' | tr ' ' '\n' | jq -R . | jq -s .)
          fi
          {
            echo "devices<<EOF"
            echo "$JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # BUILD: Download OTA, extract props, offer the freshly built .prop as an artifact.
  #        No commit, no release - the authoritative pipeline owns the repository.
  # ------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python dependencies
        run: |
          pip3 install ./payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download OTA for ${{ matrix.device }}
        run: bash download_latest_ota_build.sh ${{ matrix.device }}

      - name: Extract and collect props
        run: bash extract_images.sh

      - name: Collect built .prop
        id: collect
        run: |
          mkdir -p upload
          # the freshly extracted .prop is what git sees as new/changed (the committed
          # <codename>/*.prop are unchanged); a byte-identical rebuild shows nothing.
          mapfile -t built < <(git status --porcelain --untracked-files=all \
              | grep -E '\.prop$' | grep -v ' payload_dumper/' | cut -c4-)
          if [ ${#built[@]} -eq 0 ]; then
            echo "Nothing new built for ${{ matrix.device }} (already current)."
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in "${built[@]}"; do cp -f "$p" "upload/$(basename "$p")"; done
          echo "has=true" >> "$GITHUB_OUTPUT"

      - name: Upload .prop artifact
        if: steps.collect.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prop-${{ matrix.device }}
          path: upload/*.prop
          retention-days: 7
